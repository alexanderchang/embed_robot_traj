# 嵌入式工业机器人 EtherCAT 配置文件
# 汇川伺服驱动器 SV630N / SV660N / IS620N

[ethercat]
# EtherCAT 网卡名称
eth = eth0

# 伺服轴数量 (3~6轴)
axis_cnt = 3

[joint_limits]
# 关节软限位 (度)
min_deg = -90.0
max_deg = 90.0

# 最大速度 (rad/s)
max_vel = 2.0

# 最大加速度 (rad/s^2)
max_acc = 5.0

[servo]
# 编码器分辨率 (脉冲/圈)
pulse_per_rev = 10000

# DC同步周期 (us)
dc_period_us = 1000
